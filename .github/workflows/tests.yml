name: Tests

on:
  push:
  pull_request:
  # Weekly, to notice breaking changes in Drupal core.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    name: Drupal ${{ matrix.drupal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: '^10.3'
            # PHPStan runs on Drupal 11 only: on older cores, newer core
            # classes are reported missing. The browser tests run on Drupal
            # 11 too.
            phpstan: false
          - drupal: '^11'
            phpstan: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd
          tools: composer:v2
          coverage: none
      - name: Start chromedriver
        if: matrix.phpstan
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > /tmp/chromedriver.log 2>&1 &
          echo 'MINK_DRIVER_ARGS_WEBDRIVER=["chrome", {"browserName":"chrome","goog:chromeOptions":{"w3c":true,"args":["--headless=new","--no-sandbox","--disable-dev-shm-usage","--window-size=1280,1024"]}}, "http://localhost:9515"]' >> "$GITHUB_ENV"
      - name: Build and test
        env:
          DRUPAL_CORE: ${{ matrix.drupal }}
          NV_PHPSTAN: ${{ matrix.phpstan && '1' || '0' }}
          SIMPLETEST_BASE_URL: http://localhost:8080
        run: .github/run-tests.sh

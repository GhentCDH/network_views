views.style.network:
  type: views_style
  label: 'Network'
  mapping:
    label_field:
      type: string
      label: 'Label field'
    tooltip_fields:
      type: sequence
      label: 'Tooltip fields'
      sequence:
        type: string
        label: 'Field ID'
    color_field:
      type: string
      label: 'Color by'
    color_value_field:
      type: string
      label: 'Color from field'
    colors:
      type: string
      label: 'Colors per value'
    edge_colors:
      type: string
      label: 'Colors per edge type'
    edge_sources:
      type: sequence
      label: 'Edge sources'
      sequence:
        type: network_views.edge_source.[%key]
    shared_links:
      type: network_views_shared_links
    directed:
      type: boolean
      label: 'Directed edges'
    edge_labels:
      type: boolean
      label: 'Always show edge labels'
    hide_isolated:
      type: boolean
      label: 'Hide nodes without connections'
    language:
      type: string
      label: 'Not available in the current language'
    size:
      type: string
      label: 'Node size'
    link:
      type: boolean
      label: 'Link to the entity'
    layout:
      type: string
      label: 'Layout'
    height:
      type: string
      label: 'Height'
    legend:
      type: boolean
      label: 'Show a legend'

network_views_shared_links:
  type: sequence
  label: 'Shared links'
  sequence:
    type: mapping
    label: 'Shared links of an edge type'
    mapping:
      edge_type:
        type: string
        label: 'Edge type'
      mode:
        type: string
        label: 'Link the items with the same target or source'
      label:
        type: label
        label: 'Label of the shared links'
      max:
        type: integer
        label: 'Leave out shared items with more items (0: no limit)'

network_views_edge_source:
  type: mapping
  label: 'Edge source'
  mapping:
    enabled:
      type: boolean
      label: 'Enabled'
    settings:
      type: mapping
      label: 'Settings'

network_views.edge_source.*:
  type: network_views_edge_source

network_views.edge_source.entity_reference_fields:
  type: network_views_edge_source
  label: 'Entity reference fields'
  mapping:
    settings:
      type: mapping
      label: 'Settings'
      mapping:
        fields:
          type: sequence
          label: 'Fields'
          sequence:
            type: string
            label: 'Field name'
